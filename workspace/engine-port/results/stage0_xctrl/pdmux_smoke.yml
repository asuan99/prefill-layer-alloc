# Stage 0 SMOKE pdmux config (A100, 108 SM).
# Captures BOTH green-ctx decode partitions in one boot so the smoke gate tests
# green-ctx + cudagraph capture across multiple SM splits at once.
#   sm_group_num = 4  =>  2 manual divisions + full-prefill(idx0) + full-decode(idx3)
# Resulting STREAM_GROUPS / sm_counts (pdmux_context.initialize_stream_groups):
#   idx0 = (108,  0)   normal prefill stream
#   idx1 = ( 92, 16)   green-ctx  (decode = 16 SM)
#   idx2 = ( 64, 44)   green-ctx  (decode = 44 SM)
#   idx3 = (  0,108)   normal decode stream (decode = 108 SM)
# Division tuple = [prefill_sm, decode_sm, decode_bs_threshold]; threshold=0 => the
# adjust_stream_groups auto path (multiplexing_mixin.py:730-733) picks the group
# whenever prefill+decode coexist. R2 FixedPolicy overrides this to a fixed decode SM.
sm_group_num: 4
manual_divisions:
  - [92, 16, 0]
  - [64, 44, 0]
split_forward_token_budget: 65536
decode_bs_divisor: 36
