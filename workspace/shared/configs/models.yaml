    n_heads: 64                     # n_mamba_heads
    head_dim: 64                    # mamba_headdim
    d_state: 128                    # mamba_d_state
    chunk_size: 256                 # mamba chunk_size
    expand: 2                       # mamba_expand
    n_groups: 1                     # mamba_ngroups
    ssm_layer_fraction: 0.8421      # 32/38 pure-mamba layers
  attention:                        # shared attention in hybrid layers
